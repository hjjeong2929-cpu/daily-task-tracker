name: Morning - Create Tasks & Digest

on:
  schedule:
    # 매일 06:00 KST = 전날 21:00 UTC
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Create today's recurring task issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_recurring_issues.py

      - name: Build today's digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_digest.py
