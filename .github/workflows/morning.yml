name: Morning - Create Tasks & Digest

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create today's recurring task instances
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_recurring_issues.py
      - name: Create today's digest issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_digest.py
