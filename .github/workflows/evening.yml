name: Evening - Update Stats

on:
  schedule:
    - cron: "50 14 * * *" # 23:50 KST
  workflow_dispatch: {}

permissions:
  issues: read
  contents: write

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update completion stats + README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json README.md
          git diff --cached --quiet || git commit -m "chore: 오늘의 완료 통계 갱신"
          git push
