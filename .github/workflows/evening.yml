name: Evening - Nudge & Update Stats

on:
  schedule:
    # 매일 23:50 KST = 당일 14:50 UTC
    - cron: "50 14 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nudge stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/nudge_stale_issues.py

      - name: Update stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit updated stats
        run: |
          git config user.name "task-bot"
          git config user.email "actions@github.com"
          git add data/history.json README.md
          git diff --cached --quiet || git commit -m "chore: update task stats ($(date -u +%Y-%m-%d))"
          git push
