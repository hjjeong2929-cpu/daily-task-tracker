# ─────────────────────────────────────────────
# 반복 작업 목록 (매일/특정 요일마다 자동으로 이슈가 생성됩니다)
#
# days: all (매일) 또는 [mon, tue, wed, thu, fri, sat, sun] 조합
# priority: P1(오늘 반드시) / P2(이번 기간 내) / P3(여유될 때) — 생략 시 P2
# label: 카테고리 라벨 (선택)
# body: 이슈 본문 설명 (선택)
#
# ※ 이 파일은 "반복되는" 작업만 관리합니다.
#   1회성 할일은 그냥 GitHub에서 이슈를 새로 만들면 됩니다.
#   제목 끝에 "(YYYY-MM-DD)" 형식으로 마감일을 붙이면
#   다이제스트/통계에 자동으로 포함됩니다. 예: "보고서 제출 (2026-09-05)"
# ─────────────────────────────────────────────
tasks:
  - title: "물 2L 마시기"
    days: all
    label: "건강"
    priority: P3

  - title: "운동 30분"
    days: [mon, wed, fri]
    label: "운동"
    priority: P2
    body: "홈트든 산책이든 30분 몸 움직이기"

  - title: "주간 회고 쓰기"
    days: [sun]
    label: "회고"
    priority: P2
    body: "이번 주 잘한 것 1개, 아쉬운 것 1개, 다음 주 목표 1개 적기"
