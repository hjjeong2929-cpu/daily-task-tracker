<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Task Tracker</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --green: #16a34a;
    --gray: #6b7280;
    --border: #e5e7eb;
    --bg: #fafafa;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #111827;
  }
  #gate {
    max-width: 420px;
    margin: 80px auto;
    padding: 24px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  #gate h2 { margin-top: 0; font-size: 18px; }
  #gate input {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
  }
  #gate button, .primary-btn {
    width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
    background: var(--blue); color: white; border: none; border-radius: 8px;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  #refreshBtn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

  #calendar { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-header button { border: none; background: none; font-size: 20px; padding: 4px 12px; cursor: pointer; }
  .cal-header span { font-weight: 600; font-size: 15px; }
  #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--gray); padding: 4px 0; }
  .cal-cell {
    position: relative; aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 4px;
    border-radius: 8px; font-size: 13px; cursor: pointer; min-height: 40px;
  }
  .cal-cell.empty { cursor: default; }
  .cal-cell.today { font-weight: 700; color: var(--blue); }
  .cal-cell.selected { background: var(--blue); color: white; }
  .cal-cell .dots { display: flex; gap: 2px; margin-top: 2px; }
  .cal-cell .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--blue); }
  .cal-cell.selected .dot { background: white; }
  .cal-bar-row { grid-column: 1 / -1; height: 6px; margin-top: -2px; position: relative; }
  .period-bar {
    position: absolute; height: 6px; border-radius: 3px; background: #f59e0b; top: 0;
  }
  #selectedDateBar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  #selectedDateLabel { font-size: 14px; font-weight: 600; color: var(--gray); }
  #todayBtn { border: none; background: var(--blue-light); color: var(--blue); padding: 6px 12px; border-radius: 999px; font-size: 12px; }

  #stats { background: white; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; font-size: 13px; color: var(--gray); }

  #cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .card {
    display: flex; align-items: center; gap: 12px; background: white;
    border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .card.closed { opacity: .55; }
  .checkbox {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .checkbox-hit { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: -7px; cursor: pointer; }
  .card.closed .checkbox { background: var(--green); border-color: var(--green); color: white; }
  .card-title { flex: 1; font-size: 15px; }
  .card.closed .card-title { text-decoration: line-through; color: var(--gray); }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #f3f4f6; color: var(--gray); margin-left: 6px; }
  .skip-btn { border: none; background: none; color: var(--gray); font-size: 18px; padding: 4px 8px; cursor: pointer; }
  #emptyState { text-align: center; color: var(--gray); padding: 24px 0; font-size: 14px; }

  #addArea, #periodArea, #recurringArea { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; padding: 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; }
  .add-row button { padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: white; font-size: 14px; white-space: nowrap; }
  #addBtn { background: var(--blue); color: white; border-color: var(--blue); }

  #favDropdown { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .fav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
  .fav-item span { cursor: pointer; flex: 1; }
  .fav-remove { border: none; background: none; color: var(--gray); font-size: 16px; padding: 4px 8px; }
  .fav-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .fav-add-row input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .fav-add-row button { padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: #f9fafb; }
  #favEmpty { color: var(--gray); font-size: 13px; padding: 8px 4px; }

  details.section-toggle summary { font-size: 14px; font-weight: 600; cursor: pointer; padding: 2px 0; }
  .form-row { margin-top: 10px; }
  .form-row label { display: block; font-size: 12px; color: var(--gray); margin-bottom: 4px; }
  .form-row input[type="text"], .form-row input[type="date"] {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .day-toggles { display: flex; gap: 4px; margin-top: 6px; }
  .day-toggle {
    flex: 1; text-align: center; padding: 8px 0; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .day-toggle.active { background: var(--blue); color: white; border-color: var(--blue); }
  .range-row { display: flex; gap: 8px; }
  .range-row .form-row { flex: 1; }
  .submit-btn {
    margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: var(--blue); color: white; font-size: 15px; font-weight: 600;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="gate">
  <h2>GitHub Personal Access Token 입력</h2>
  <p style="font-size:13px;color:#6b7280;">repo 권한이 있는 토큰이 필요해요. 이 브라우저에만 저장되고 어디로도 전송되지 않아요.</p>
  <input id="tokenInput" type="password" placeholder="ghp_..." />
  <button id="saveTokenBtn">저장하고 시작</button>
</div>

<div id="app" hidden>
  <header>
    <h1>✅ Daily Task Tracker</h1>
    <button id="refreshBtn">새로고침</button>
  </header>

  <section id="calendar">
    <div class="cal-header">
      <button id="prevMonth">‹</button>
      <span id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
    <div id="calGrid"></div>
    <div id="selectedDateBar">
      <span id="selectedDateLabel"></span>
      <button id="todayBtn" hidden>오늘로 돌아가기</button>
    </div>
  </section>

  <section id="stats"><span id="statsText">불러오는 중...</span></section>

  <section id="cards"></section>
  <div id="emptyState" hidden>이 날짜엔 등록된 할일이 없어요.</div>

  <section id="addArea">
    <div class="add-row">
      <input id="newTitle" type="text" placeholder="할일 입력..." />
      <button id="favBtn">즐겨찾기 ▾</button>
    </div>
    <div class="add-row" style="margin-top:8px;">
      <button id="addBtn" style="flex:1;">선택한 날짜에 추가</button>
    </div>
    <div id="favDropdown" hidden>
      <div id="favList"></div>
      <div id="favEmpty" hidden>즐겨찾기가 없어요.</div>
      <div class="fav-add-row">
        <input id="favNewInput" type="text" placeholder="새 즐겨찾기 문구" />
        <button id="favAddBtn">저장</button>
      </div>
    </div>
  </section>

  <details class="section-toggle">
    <summary>+ Period 할일 등록 (기간의 마지막 날에만 노출)</summary>
    <div class="form-row">
      <label>제목</label>
      <input id="periodTitle" type="text" placeholder="예: 분기 보고서 제출" />
    </div>
    <div class="range-row">
      <div class="form-row">
        <label>시작일</label>
        <input id="periodStart" type="date" />
      </div>
      <div class="form-row">
        <label>종료일</label>
        <input id="periodEnd" type="date" />
      </div>
    </div>
    <button id="periodAddBtn" class="submit-btn">Period 할일 등록</button>
  </details>

  <details class="section-toggle" id="recDetails" style="margin-top:8px;">
    <summary>+ 반복 할일 등록 (요일 + 기간 지정)</summary>
    <div style="margin:10px 0;">
      <div style="font-size:13px;color:#6b7280;margin-bottom:4px;">현재 등록된 반복 할일</div>
      <div id="recRulesList"></div>
      <div id="recRulesEmpty" hidden style="color:#6b7280;font-size:13px;padding:8px 4px;">등록된 반복 할일이 없어요.</div>
    </div>
    <div class="form-row">
      <label>제목</label>
      <input id="recTitle" type="text" placeholder="예: 스트레칭" />
    </div>
    <div class="form-row">
      <label>요일 (여러 개 선택 가능)</label>
      <div class="day-toggles" id="dayToggles"></div>
    </div>
    <div class="form-row">
      <label><input type="checkbox" id="recHasRange" /> 기간 지정 (체크 안 하면 무기한 반복)</label>
    </div>
    <div class="range-row" id="recRangeInputs" hidden>
      <div class="form-row">
        <label>시작일</label>
        <input id="recStart" type="date" />
      </div>
      <div class="form-row">
        <label>종료일</label>
        <input id="recEnd" type="date" />
      </div>
    </div>
    <button id="recAddBtn" class="submit-btn">반복 할일 등록</button>
    <p style="font-size:12px;color:#6b7280;margin-top:8px;">참고: 여기서 등록하면 내일 아침부터 자동 반영돼요. 오늘 이미 지나간 자동 생성 시점에는 소급 적용되지 않아요.</p>
  </details>
</div>

<script>
(function () {
  const OWNER = "hjjeong2929-cpu";
  const REPO = "daily-task-tracker";
  const TOKEN_KEY = "dtt_gh_token";
  const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const DIGEST_LABEL = "digest";
  const SKIPPED_LABEL = "skipped";
  const PERIOD_LABEL = "period";
  const RECURRING_LABEL = "recurring";
  const DAY_LABELS = ["일", "월", "화", "수", "목", "금", "토"];
  const DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

  let token = localStorage.getItem(TOKEN_KEY) || "";
  let allIssues = []; // parsed cache
  let selectedDate = todayKST(); // "YYYY-MM-DD"
  let calYear, calMonth; // calMonth: 0-11
  {
    const [y, m] = selectedDate.split("-").map(Number);
    calYear = y; calMonth = m - 1;
  }
  let selectedDays = new Set(); // for recurring form

  // ---------- date helpers ----------
  function todayKST() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function ymd(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function extractDueDate(title) {
    const m = title.match(/\((\d{4}-\d{2}-\d{2})\)\s*$/);
    return m ? m[1] : null;
  }
  function stripDueDate(title) {
    return title.replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*$/, "");
  }
  function extractPeriodStart(body) {
    if (!body) return null;
    const m = body.match(/<!--\s*period_start:\s*(\d{4}-\d{2}-\d{2})\s*-->/);
    return m ? m[1] : null;
  }
  function formatKoreanDate(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const wd = ["일", "월", "화", "수", "목", "금", "토"][new Date(y, m - 1, d).getDay()];
    return `${y}년 ${m}월 ${d}일 (${wd})`;
  }

  // ---------- GitHub API ----------
  async function ghFetch(path, opts = {}) {
    const res = await fetch(path.startsWith("http") ? path : `${API}${path}`, {
      ...opts,
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
        ...(opts.headers || {}),
      },
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`${opts.method || "GET"} ${path} -> ${res.status}: ${text}`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadAllIssues() {
    let results = [];
    for (let page = 1; page <= 6; page++) {
      const data = await ghFetch(`/issues?state=all&per_page=100&page=${page}`);
      if (!data || data.length === 0) break;
      results = results.concat(data.filter((i) => !i.pull_request));
      if (data.length < 100) break;
    }
    allIssues = results.map((issue) => {
      const labelNames = (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name));
      return {
        number: issue.number,
        title: issue.title,
        state: issue.state,
        body: issue.body,
        labels: labelNames,
        due: extractDueDate(issue.title),
        periodStart: labelNames.includes(PERIOD_LABEL) ? extractPeriodStart(issue.body) : null,
        isDigest: labelNames.includes(DIGEST_LABEL),
        isPeriod: labelNames.includes(PERIOD_LABEL),
        isRecurring: labelNames.includes(RECURRING_LABEL),
        isSkipped: labelNames.includes(SKIPPED_LABEL),
      };
    });
  }

  function issuesForDate(dateStr) {
    return allIssues
      .filter((i) => !i.isDigest && !i.isSkipped && i.due === dateStr)
      .sort((a, b) => (a.state === b.state ? a.number - b.number : a.state === "open" ? -1 : 1));
  }

  // ---------- calendar ----------
  function renderCalendar() {
    document.getElementById("monthLabel").textContent = `${calYear}년 ${calMonth + 1}월`;
    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    DAY_LABELS.forEach((d) => {
      const el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDow = new Date(calYear, calMonth, 1).getDay();
    const total = daysInMonth(calYear, calMonth);
    const today = todayKST();

    // dot counts per day (non-period issues due that day)
    const dotCounts = {};
    allIssues.forEach((i) => {
      if (i.isDigest || i.isPeriod || i.isSkipped || !i.due) return;
      const [y, m] = i.due.split("-").map(Number);
      if (y === calYear && m === calMonth + 1) {
        dotCounts[i.due] = (dotCounts[i.due] || 0) + 1;
      }
    });

    for (let i = 0; i < firstDow; i++) {
      const el = document.createElement("div");
      el.className = "cal-cell empty";
      grid.appendChild(el);
    }
    for (let d = 1; d <= total; d++) {
      const dateStr = ymd(calYear, calMonth, d);
      const cell = document.createElement("div");
      cell.className = "cal-cell";
      if (dateStr === today) cell.classList.add("today");
      if (dateStr === selectedDate) cell.classList.add("selected");
      const num = document.createElement("div");
      num.textContent = d;
      cell.appendChild(num);
      const count = dotCounts[dateStr] || 0;
      if (count > 0) {
        const dots = document.createElement("div");
        dots.className = "dots";
        for (let k = 0; k < Math.min(count, 4); k++) {
          const dot = document.createElement("div");
          dot.className = "dot";
          dots.appendChild(dot);
        }
        cell.appendChild(dots);
      }
      cell.addEventListener("click", () => {
        selectedDate = dateStr;
        renderCalendar();
        renderSelectedBar();
        renderList();
      });
      grid.appendChild(cell);
    }

    renderPeriodBars(firstDow, total);
  }

  function renderPeriodBars(firstDow, totalDays) {
    const container = document.getElementById("calGrid");
    const monthStart = ymd(calYear, calMonth, 1);
    const monthEnd = ymd(calYear, calMonth, totalDays);
    allIssues
      .filter((i) => i.isPeriod && !i.isSkipped && i.periodStart && i.due)
      .filter((i) => i.periodStart <= monthEnd && i.due >= monthStart)
      .forEach((i) => {
        const startD = i.periodStart < monthStart ? 1 : Number(i.periodStart.split("-")[2]);
        const endD = i.due > monthEnd ? totalDays : Number(i.due.split("-")[2]);
        const bar = document.createElement("div");
        bar.className = "period-bar";
        bar.title = stripDueDate(i.title);
        const colStart = ((startD - 1 + firstDow) % 7) + 1;
        const rowIndex = Math.floor((startD - 1 + firstDow) / 7);
        bar.style.position = "absolute";
        bar.style.left = `calc(${((colStart - 1) / 7) * 100}% + 2px)`;
        bar.style.width = `calc(${((Math.min(endD, startD + (7 - colStart)) - startD + 1) / 7) * 100}% - 4px)`;
        bar.style.top = `${44 + rowIndex * 46}px`;
        container.style.position = "relative";
        container.appendChild(bar);
      });
  }

  function renderSelectedBar() {
    document.getElementById("selectedDateLabel").textContent = formatKoreanDate(selectedDate);
    document.getElementById("todayBtn").hidden = selectedDate === todayKST();
  }

  // ---------- task list ----------
  function renderList() {
    const cardsEl = document.getElementById("cards");
    const emptyEl = document.getElementById("emptyState");
    cardsEl.innerHTML = "";
    const items = issuesForDate(selectedDate);
    emptyEl.hidden = items.length > 0;
    items.forEach((issue) => {
      const card = document.createElement("div");
      card.className = "card" + (issue.state === "closed" ? " closed" : "");

      const hit = document.createElement("div");
      hit.className = "checkbox-hit";
      const box = document.createElement("div");
      box.className = "checkbox";
      box.textContent = issue.state === "closed" ? "✓" : "";
      hit.appendChild(box);
      hit.addEventListener("click", () => toggleComplete(issue));
      card.appendChild(hit);

      const titleEl = document.createElement("div");
      titleEl.className = "card-title";
      titleEl.textContent = stripDueDate(issue.title);
      if (issue.isPeriod) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "Period";
        titleEl.appendChild(tag);
      }
      card.appendChild(titleEl);

      if (issue.state === "open" && !issue.isDigest) {
        const skipBtn = document.createElement("button");
        skipBtn.className = "skip-btn";
        skipBtn.textContent = "✕";
        skipBtn.title = issue.isRecurring ? "오늘은 해당 없음 (삭제)" : "삭제";
        skipBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          skipInstance(issue);
        });
        card.appendChild(skipBtn);
      }

      cardsEl.appendChild(card);
    });
  }

  async function toggleComplete(issue) {
    const newState = issue.state === "closed" ? "open" : "closed";
    await ghFetch(`/issues/${issue.number}`, { method: "PATCH", body: JSON.stringify({ state: newState }) });
    issue.state = newState;
    renderList();
    renderCalendar();
  }

  async function skipInstance(issue) {
    const newLabels = Array.from(new Set([...issue.labels, SKIPPED_LABEL]));
    await ghFetch(`/issues/${issue.number}`, {
      method: "PATCH",
      body: JSON.stringify({ state: "closed", labels: newLabels }),
    });
    allIssues = allIssues.filter((i) => i.number !== issue.number);
    renderList();
    renderCalendar();
  }

  async function addTask(titleText, dateStr) {
    if (!titleText.trim()) return;
    const title = `${titleText.trim()} (${dateStr})`;
    const issue = await ghFetch(`/issues`, {
      method: "POST",
      body: JSON.stringify({ title, assignees: [OWNER] }),
    });
    allIssues.push({
      number: issue.number,
      title: issue.title,
      state: "open",
      body: issue.body,
      labels: [],
      due: dateStr,
      periodStart: null,
      isDigest: false,
      isPeriod: false,
      isRecurring: false,
      isSkipped: false,
    });
    renderList();
    renderCalendar();
  }

  // ---------- favorites (data/favorites.json via Contents API) ----------
  let favoritesSha = null;
  async function loadFavorites() {
    try {
      const data = await ghFetch(`/contents/data/favorites.json`);
      favoritesSha = data.sha;
      return JSON.parse(decodeURIComponent(escape(atob(data.content))));
    } catch (e) {
      favoritesSha = null;
      return [];
    }
  }
  async function saveFavorites(list, message) {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2) + "\n")));
    const payload = { message, content };
    if (favoritesSha) payload.sha = favoritesSha;
    const res = await ghFetch(`/contents/data/favorites.json`, { method: "PUT", body: JSON.stringify(payload) });
    favoritesSha = res.content.sha;
  }
  async function renderFavDropdown() {
    const list = await loadFavorites();
    const favList = document.getElementById("favList");
    const favEmpty = document.getElementById("favEmpty");
    favList.innerHTML = "";
    favEmpty.hidden = list.length > 0;
    list.forEach((title) => {
      const row = document.createElement("div");
      row.className = "fav-item";
      const span = document.createElement("span");
      span.textContent = title;
      span.addEventListener("click", async () => {
        await addTask(title, selectedDate);
        document.getElementById("favDropdown").hidden = true;
      });
      row.appendChild(span);
      const rm = document.createElement("button");
      rm.className = "fav-remove";
      rm.textContent = "✕";
      rm.addEventListener("click", async (e) => {
        e.stopPropagation();
        const updated = list.filter((t) => t !== title);
        await saveFavorites(updated, `chore: 즐겨찾기 삭제 - ${title}`);
        renderFavDropdown();
      });
      row.appendChild(rm);
      favList.appendChild(row);
    });
  }

  // ---------- recurring rules (data/recurring_rules.json via Contents API) ----------
  async function loadRecurringRules() {
    const data = await ghFetch(`/contents/data/recurring_rules.json`);
    return { sha: data.sha, rules: JSON.parse(decodeURIComponent(escape(atob(data.content)))) };
  }
  async function saveRecurringRules(rules, sha, message) {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(rules, null, 2) + "\n")));
    const payload = { message, content, sha };
    await ghFetch(`/contents/data/recurring_rules.json`, { method: "PUT", body: JSON.stringify(payload) });
  }
  async function renderRecurringRulesList() {
    const listEl = document.getElementById("recRulesList");
    const emptyEl = document.getElementById("recRulesEmpty");
    const { sha, rules } = await loadRecurringRules();
    listEl.innerHTML = "";
    emptyEl.hidden = rules.length > 0;
    rules.forEach((rule) => {
      const row = document.createElement("div");
      row.className = "fav-item";
      const span = document.createElement("span");
      const daysLabel = rule.days.map((k) => DAY_LABELS[DAY_KEYS.indexOf(k)]).join("·");
      const rangeLabel = rule.start_date && rule.end_date ? ` (${rule.start_date} ~ ${rule.end_date})` : "";
      span.textContent = `${rule.title} - ${daysLabel}${rangeLabel}`;
      row.appendChild(span);
      const rm = document.createElement("button");
      rm.className = "fav-remove";
      rm.textContent = "✕";
      rm.title = "삭제";
      rm.addEventListener("click", async () => {
        const updated = rules.filter((r) => r.id !== rule.id);
        await saveRecurringRules(updated, sha, `chore: 반복 할일 삭제 - ${rule.title}`);
        renderRecurringRulesList();
      });
      row.appendChild(rm);
      listEl.appendChild(row);
    });
  }

  // ---------- stats (data/history.json, read-only raw fetch) ----------
  async function loadStats() {
    try {
      const res = await fetch(
        `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/data/history.json?t=${Date.now()}`
      );
      const history = await res.json();
      const recent = history.slice(-14);
      let streak = 0;
      for (let i = history.length - 1; i >= 0; i--) {
        const e = history[i];
        if (e.total > 0 && e.completed === e.total) streak++;
        else break;
      }
      const totalSum = recent.reduce((s, e) => s + e.total, 0);
      const completedSum = recent.reduce((s, e) => s + e.completed, 0);
      const avg = totalSum > 0 ? Math.round((completedSum / totalSum) * 100) : 0;
      document.getElementById("statsText").textContent = `🔥 연속 ${streak}일 완료 · 최근 14일 평균 완료율 ${avg}%`;
    } catch (e) {
      document.getElementById("statsText").textContent = "아직 통계가 없어요.";
    }
  }

  // ---------- wiring ----------
  function buildDayToggles() {
    const wrap = document.getElementById("dayToggles");
    wrap.innerHTML = "";
    DAY_KEYS.forEach((key, idx) => {
      const el = document.createElement("div");
      el.className = "day-toggle";
      el.textContent = DAY_LABELS[idx];
      el.addEventListener("click", () => {
        if (selectedDays.has(key)) selectedDays.delete(key);
        else selectedDays.add(key);
        el.classList.toggle("active");
      });
      wrap.appendChild(el);
    });
  }

  async function init() {
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    buildDayToggles();
    await loadAllIssues();
    renderCalendar();
    renderSelectedBar();
    renderList();
    loadStats();
  }

  document.getElementById("saveTokenBtn").addEventListener("click", () => {
    const v = document.getElementById("tokenInput").value.trim();
    if (!v) return;
    token = v;
    localStorage.setItem(TOKEN_KEY, v);
    init();
  });

  document.getElementById("refreshBtn").addEventListener("click", async () => {
    await loadAllIssues();
    renderCalendar();
    renderList();
    loadStats();
  });

  document.getElementById("prevMonth").addEventListener("click", () => {
    calMonth -= 1;
    if (calMonth < 0) { calMonth = 11; calYear -= 1; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    calMonth += 1;
    if (calMonth > 11) { calMonth = 0; calYear += 1; }
    renderCalendar();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    selectedDate = todayKST();
    const [y, m] = selectedDate.split("-").map(Number);
    calYear = y; calMonth = m - 1;
    renderCalendar();
    renderSelectedBar();
    renderList();
  });

  document.getElementById("favBtn").addEventListener("click", () => {
    const el = document.getElementById("favDropdown");
    el.hidden = !el.hidden;
    if (!el.hidden) renderFavDropdown();
  });
  document.getElementById("favAddBtn").addEventListener("click", async () => {
    const input = document.getElementById("favNewInput");
    const v = input.value.trim();
    if (!v) return;
    const list = await loadFavorites();
    if (!list.includes(v)) list.push(v);
    await saveFavorites(list, `chore: 즐겨찾기 추가 - ${v}`);
    input.value = "";
    renderFavDropdown();
  });

  document.getElementById("addBtn").addEventListener("click", async () => {
    const input = document.getElementById("newTitle");
    await addTask(input.value, selectedDate);
    input.value = "";
  });
  document.getElementById("newTitle").addEventListener("keydown", async (e) => {
    if (e.key === "Enter") document.getElementById("addBtn").click();
  });

  document.getElementById("periodAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("periodTitle").value.trim();
    const start = document.getElementById("periodStart").value;
    const end = document.getElementById("periodEnd").value;
    if (!title || !start || !end) { alert("제목/시작일/종료일을 모두 입력해주세요."); return; }
    const fullTitle = `${title} (${end})`;
    const body = `<!-- period_start: ${start} -->\n기간: ${start} ~ ${end}`;
    const issue = await ghFetch(`/issues`, {
      method: "POST",
      body: JSON.stringify({ title: fullTitle, body, labels: [PERIOD_LABEL], assignees: [OWNER] }),
    });
    allIssues.push({
      number: issue.number, title: fullTitle, state: "open", body,
      labels: [PERIOD_LABEL], due: end, periodStart: start,
      isDigest: false, isPeriod: true, isRecurring: false, isSkipped: false,
    });
    document.getElementById("periodTitle").value = "";
    document.getElementById("periodStart").value = "";
    document.getElementById("periodEnd").value = "";
    renderCalendar();
    renderList();
  });

  document.getElementById("recHasRange").addEventListener("change", (e) => {
    document.getElementById("recRangeInputs").hidden = !e.target.checked;
  });

  document.getElementById("recDetails").addEventListener("toggle", (e) => {
    if (e.target.open) renderRecurringRulesList();
  });

  document.getElementById("recAddBtn").addEventListener("click", async () => {
    const title = document.getElementById("recTitle").value.trim();
    if (!title) { alert("제목을 입력해주세요."); return; }
    if (selectedDays.size === 0) { alert("요일을 하나 이상 선택해주세요."); return; }
    const hasRange = document.getElementById("recHasRange").checked;
    const rule = { id: `rule-${Date.now()}`, title, days: Array.from(selectedDays) };
    if (hasRange) {
      const start = document.getElementById("recStart").value;
      const end = document.getElementById("recEnd").value;
      if (!start || !end) { alert("기간을 지정하려면 시작일/종료일을 모두 입력해주세요."); return; }
      rule.start_date = start;
      rule.end_date = end;
    }
    const { sha, rules } = await loadRecurringRules();
    rules.push(rule);
    await saveRecurringRules(rules, sha, `feat: 반복 할일 추가 - ${title}`);
    document.getElementById("recTitle").value = "";
    selectedDays = new Set();
    buildDayToggles();
    document.getElementById("recHasRange").checked = false;
    document.getElementById("recRangeInputs").hidden = true;
    alert("등록됐어요! 내일 아침부터 자동으로 생성됩니다.");
    renderRecurringRulesList();
  });

  if (token) init();
})();
</script>
</body>
</html>
